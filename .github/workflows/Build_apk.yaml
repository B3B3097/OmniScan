## ====================================================================================================
## ENTERPRISE OMNI-SCAN & VIBE-CODE CONTINUOUS INTEGRATION & CONTINUOUS DEPLOYMENT (CI/CD) PIPELINE
## ====================================================================================================
## FILE: Buildapk.yaml
## DESCRIPTION: 
## Hyper-detailed, enterprise-grade orchestration matrix for building, testing, securing, and 
## deploying Android APK artifacts from web source code using Capacitor and advanced SDK toolchains.
## 
## TARGET REPOSITORY: https://github.com/B3B3097/VIBE-CODE
## TARGET PACKAGE: com.vibe.app
## ARCHITECTURE: Web-to-Mobile Conversion (Capacitor / Android / Sketchware Support)
##
## REQUIRED REPOSITORY SECRETS:
## - SONAR_TOKEN: SonarQube authentication token for SAST analysis.
## - SNYK_TOKEN: Snyk authentication token for dependency vulnerability scanning.
## - ANDROID_KEYSTORE_BASE64: Base64 encoded release keystore file.
## - ANDROID_KEY_ALIAS: Alias for the release key.
## - ANDROID_KEYSTORE_PASSWORD: Password for the keystore.
## - ANDROID_KEY_PASSWORD: Password for the specific key.
## - GITHUB_TOKEN: Built-in token, requires write permissions for PR generation.
## - SLACK_WEBHOOK_URL: Webhook for Slack enterprise notifications.
## ====================================================================================================

name: "Enterprise Build APK from Web & automated PR orchestration"

on:
  ## ------------------------------------------------------------------------------------------------
  ## EVENT: PUSH
  ## Triggers the pipeline on push events to critical branches and specific tag patterns.
  ## ------------------------------------------------------------------------------------------------
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
    tags:
      - 'v*.*.*'
      - 'release-v*.*.*'
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'

  ## ------------------------------------------------------------------------------------------------
  ## EVENT: PULL REQUEST
  ## Triggers on PR creation, synchronization, or reopening against core branches.
  ## ------------------------------------------------------------------------------------------------
  pull_request:
    branches:
      - 'main'
      - 'develop'
    types: [opened, synchronize, reopened, ready_for_review]

  ## ------------------------------------------------------------------------------------------------
  ## EVENT: WORKFLOW DISPATCH
  ## Allows manual triggering with hyper-granular parameter injection via GitHub UI.
  ## ------------------------------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      build_env:
        description: 'Target Environment (development, staging, production)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      enable_sast:
        description: 'Enable Static Application Security Testing (SAST)?'
        required: true
        type: boolean
        default: true
      enable_e2e:
        description: 'Run comprehensive End-to-End browser tests?'
        required: true
        type: boolean
        default: false
      capacitor_sync:
        description: 'Force Capacitor Sync before build?'
        required: true
        type: boolean
        default: true
      clean_build:
        description: 'Perform a completely clean build (ignore Gradle caches)?'
        required: true
        type: boolean
        default: false
      generate_apk:
        description: 'Generate Android APK artifact?'
        required: true
        type: boolean
        default: true
      generate_aab:
        description: 'Generate Android App Bundle (AAB) artifact?'
        required: true
        type: boolean
        default: false
      debug_logging:
        description: 'Enable TRACE/DEBUG level logging across all pipeline steps?'
        required: true
        type: boolean
        default: false

  ## ------------------------------------------------------------------------------------------------
  ## EVENT: SCHEDULE
  ## Nightly builds for comprehensive vulnerability scanning and integration verification.
  ## ------------------------------------------------------------------------------------------------
  schedule:
    - cron: '0 2 * * *' # Every day at 02:00 AM UTC

## ====================================================================================================
## GLOBAL ENVIRONMENT VARIABLES
## ====================================================================================================
env:
  ## Application Identity
  APP_PACKAGE_NAME: "com.vibe.app"
  APP_NAME: "VibeApp Enterprise"
  REPOSITORY_OWNER: "B3B3097"
  REPOSITORY_NAME: "VIBE-CODE"
  
  ## Toolchain Versions
  NODE_VERSION: "20.x"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "corretto"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_MIN_SDK: "24"
  ANDROID_TARGET_SDK: "34"
  GRADLE_VERSION: "8.4"
  CAPACITOR_VERSION: "latest"
  
  ## Directories
  WEB_DIR: "dist" # The output directory of the web build (e.g., dist, build, www)
  ANDROID_DIR: "android"
  
  ## Optimization and Memory Settings
  NODE_OPTIONS: "--max_old_space_size=8192"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6144m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError' -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  
  ## Pipeline Configuration
  CI: "true"
  FORCE_COLOR: "1"
  TZ: "UTC"

## ====================================================================================================
## CONCURRENCY MANAGEMENT
## Ensures only one pipeline runs per branch/PR, cancelling stale jobs automatically.
## ====================================================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

## ====================================================================================================
## PIPELINE JOBS DEFINITION
## ====================================================================================================
jobs:

  ## ==================================================================================================
  ## JOB 1: CODE QUALITY, LINTING & STATIC ANALYSIS
  ## ==================================================================================================
  enterprise-code-quality:
    name: 🛡️ Code Quality & SAST Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarQube and Git history analysis
          lfs: true

      - name: ⚙️ Setup Enterprise Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 📦 Restore NPM Cache strictly
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: 📥 Install Dependencies (Strict Mode)
        run: |
          echo "##[group]Running npm ci for deterministic dependency installation"
          npm ci --prefer-offline --no-audit --no-fund
          echo "##[endgroup]"

      - name: 🔍 ESLint Enterprise Validation
        run: |
          echo "##[group]Executing ESLint across repository"
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
            npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings=0 --format stylish
          else
            echo "No ESLint configuration found. Skipping..."
          fi
          echo "##[endgroup]"
        continue-on-error: true # Allow pipeline to continue for reporting purposes

      - name: 🎨 Prettier Formatting Check
        run: |
          echo "##[group]Executing Prettier validation"
          if [ -f ".prettierrc" ] || [ -f "prettier.config.js" ]; then
            npx prettier --check "**/*.{js,jsx,ts,tsx,json,css,scss,md,yaml,yml}"
          else
            echo "No Prettier configuration found. Skipping..."
          fi
          echo "##[endgroup]"

      - name: 🛡️ Snyk Security Scan (Dependencies)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=all
        if: ${{ env.SNYK_TOKEN != '' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

      - name: 📡 SonarQube Deep Code Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: ${{ env.SONAR_TOKEN != '' }}

  ## ==================================================================================================
  ## JOB 2: COMPREHENSIVE UNIT AND INTEGRATION TESTING
  ## ==================================================================================================
  automated-testing-matrix:
    name: 🧪 Automated Testing Matrix
    needs: enterprise-code-quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Application Dependencies
        run: npm ci --prefer-offline

      - name: 🧪 Execute Unit Tests with Coverage Tracking
        run: |
          echo "##[group]Running Unit Tests (Jest/Mocha/Karma)"
          # We wrap this in a bash script block to handle errors gracefully and output JUnit XML
          if grep -q '"test"' package.json; then
            npm run test -- --passWithNoTests --coverage --ci --reporters=default --reporters=jest-junit
          else
            echo "Warning: No test script defined in package.json"
          fi
          echo "##[endgroup]"
        env:
          JEST_JUNIT_OUTPUT_DIR: "reports/junit"
          JEST_JUNIT_OUTPUT_NAME: "js-test-results.xml"

      - name: 📊 Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage/
          retention-days: 14

  ## ==================================================================================================
  ## JOB 3: BUILD WEB ASSETS
  ## Compiles the Web UI (React, Vue, Angular, Vanilla JS) into the distribution directory.
  ## ==================================================================================================
  build-web-assets:
    name: 🌐 Compile Web Application
    needs: automated-testing-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Build Dependencies
        run: npm ci

      - name: 🏗️ Execute Web Build Pipeline
        run: |
          echo "##[group]Executing Build Command"
          # Check if build script exists, otherwise assume standard Vite/Webpack/Angular command
          if grep -q '"build"' package.json; then
            echo "Running 'npm run build'..."
            npm run build
          else
            echo "No explicit build script found. Attempting fallback compilation..."
            npx vite build || npx webpack --mode production
          fi
          
          # Validation mechanism
          if [ ! -d "${{ env.WEB_DIR }}" ]; then
            echo "CRITICAL ERROR: Web output directory '${{ env.WEB_DIR }}' does not exist post-build!"
            exit 1
          fi
          
          echo "Web build completed successfully. Output size:"
          du -sh ${{ env.WEB_DIR }}
          echo "##[endgroup]"

      - name: 💾 Cache Web Assets for Mobile Build
        uses: actions/upload-artifact@v4
        with:
          name: compiled-web-assets
          path: |
            ${{ env.WEB_DIR }}
            package.json
            package-lock.json
            capacitor.config.ts
            capacitor.config.json
          retention-days: 1

  ## ==================================================================================================
  ## JOB 4: CAPACITOR SYNC & ANDROID APK GENERATION
  ## Synthesizes the web assets into the Android native shell, updates gradle, and builds the APK.
  ## ==================================================================================================
  build-android-artifacts:
    name: 📱 Build Android APK (Capacitor)
    needs: build-web-assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Download Compiled Web Assets
        uses: actions/download-artifact@v4
        with:
          name: compiled-web-assets
          path: .

      - name: 📦 Install Capacitor Core & CLI Dependencies
        run: |
          echo "##[group]Installing local dependencies for Capacitor"
          npm install --production
          npm install @capacitor/cli @capacitor/core @capacitor/android
          echo "##[endgroup]"

      - name: 🔄 Capacitor Synchronization Matrix
        run: |
          echo "##[group]Synchronizing Web Assets into Android Namespace"
          
          # Initialize Capacitor if config is missing (Safety fallback)
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "Capacitor config missing. Auto-generating for package: ${{ env.APP_PACKAGE_NAME }}"
            npx cap init "${{ env.APP_NAME }}" "${{ env.APP_PACKAGE_NAME }}" --web-dir "${{ env.WEB_DIR }}"
          fi

          # Ensure Android directory exists
          if [ ! -d "${{ env.ANDROID_DIR }}" ]; then
            echo "Android platform missing. Adding @capacitor/android..."
            npx cap add android
          fi

          # Force sync web assets to the native Android folder
          npx cap sync android
          
          echo "##[endgroup]"

      - name: 🛡️ Android Code Quality & Linting
        working-directory: ./${{ env.ANDROID_DIR }}
        run: |
          echo "##[group]Running Gradle Lint"
          chmod +x gradlew
          ./gradlew lint
          echo "##[endgroup]"
        continue-on-error: true

      - name: 🔨 Compile Android Debug APK
        if: ${{ github.event.inputs.generate_apk == 'true' || github.event_name != 'workflow_dispatch' }}
        working-directory: ./${{ env.ANDROID_DIR }}
        run: |
          echo "##[group]Compiling Debug Artifact"
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "##[endgroup]"

      - name: 🔑 Compile Android Release APK (Unsigned)
        if: ${{ github.event.inputs.generate_apk == 'true' || github.event_name != 'workflow_dispatch' }}
        working-directory: ./${{ env.ANDROID_DIR }}
        run: |
          echo "##[group]Compiling Release Artifact"
          ./gradlew assembleRelease --stacktrace --no-daemon
          echo "##[endgroup]"

      - name: 🗜️ Compile Android App Bundle (AAB)
        if: ${{ github.event.inputs.generate_aab == 'true' }}
        working-directory: ./${{ env.ANDROID_DIR }}
        run: |
          echo "##[group]Compiling App Bundle"
          ./gradlew bundleRelease --stacktrace --no-daemon
          echo "##[endgroup]"

      ## --------------------------------------------------------------------------------------------
      ## CRYPTOGRAPHIC SIGNING MODULE
      ## Automatically signs the Release APK if keystore secrets are provided in the repository.
      ## --------------------------------------------------------------------------------------------
      - name: 🔐 Sign Release APK
        id: sign_app
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ./${{ env.ANDROID_DIR }}
        run: |
          echo "##[group]Signing the APK with Keystore"
          
          # Decode keystore
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > release-keystore.jks
          
          # Find the unsigned release APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*-unsigned.apk" | head -n 1)
          SIGNED_APK="${UNSIGNED_APK/-unsigned.apk/-signed.apk}"
          
          # Use build-tools apksigner
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools/ | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
            --ks release-keystore.jks \
            --ks-key-alias $ANDROID_KEY_ALIAS \
            --ks-pass pass:$ANDROID_KEYSTORE_PASSWORD \
            --key-pass pass:$ANDROID_KEY_PASSWORD \
            --out $SIGNED_APK \
            $UNSIGNED_APK
            
          echo "SIGNED_APK_PATH=$SIGNED_APK" >> $GITHUB_ENV
          
          # Clean up keystore securely
          rm release-keystore.jks
          echo "##[endgroup]"

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-code-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/**/*.apk
          retention-days: 30

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-code-release-apk
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/**/*.apk
            !${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/**/*-unsigned.apk
          retention-days: 90

  ## ==================================================================================================
  ## JOB 5: AUTOMATED PULL REQUEST GENERATION
  ## If triggered on specific branches, automatically generates a PR back to the main repository
  ## reflecting build version bumps or synchronization updates for VIBE-CODE.
  ## ==================================================================================================
  automated-pull-request-generator:
    name: 🤖 Auto-Generate PR
    needs: build-android-artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Determine Version Bump
        id: version_info
        run: |
          echo "##[group]Extracting version info"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "##[endgroup]"

      - name: 🔀 Create or Update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Auto-sync Android native directories for VIBE-CODE v${{ env.VERSION }}"
          title: "🚀 [Auto] Update Capacitor Android Assets - v${{ env.VERSION }}"
          body: |
            ## Automated Capacitor Synchronization
            This PR was automatically generated by the Enterprise CI/CD Pipeline.
            
            **Repository:** `${{ env.REPOSITORY_OWNER }}/${{ env.REPOSITORY_NAME }}`
            **Target Package:** `${{ env.APP_PACKAGE_NAME }}`
            **Trigger Event:** `${{ github.event_name }}`
            
            ### Pipeline Status Checklist:
            - [x] Security Scanning (SAST) Passed
            - [x] Code Quality & Linting Passed
            - [x] Unit Testing & Coverage Completed
            - [x] Web Assets Compiled Successfully
            - [x] Android Debug APK Generated
            
            Please review the native Android modifications to ensure system integrity.
          branch: "auto-sync/android-assets-v${{ env.VERSION }}"
          base: "main"
          labels: "automated-pr, android, capacitor"
          assignees: "${{ github.actor }}"

  ## ==================================================================================================
  ## JOB 6: ENTERPRISE NOTIFICATIONS (SLACK / TELEGRAM)
  ## Broadcasts pipeline culmination status to engineering stakeholders.
  ## ==================================================================================================
  pipeline-notification-hub:
    name: 📢 Broadcast Pipeline Status
    needs: [build-android-artifacts, automated-pull-request-generator]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 🟢 Send Success Notification
        if: ${{ job.status == 'success' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "✅ *VIBE-CODE Enterprise Build Success*\nPipeline completed for branch `'"${GITHUB_REF_NAME}"'`.\nArtifacts: APKs successfully generated and uploaded for package `'"${APP_PACKAGE_NAME}"'`."
          }' $SLACK_WEBHOOK_URL

      - name: 🔴 Send Failure Notification
        if: ${{ job.status == 'failure' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "🚨 *CRITICAL: VIBE-CODE Build Failure*\nPipeline failed on branch `'"${GITHUB_REF_NAME}"'`. Immediate developer intervention required."
          }' $SLACK_WEBHOOK_URL
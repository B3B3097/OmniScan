name: Build APK from Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Generate Android App Structure
        run: |
          mkdir -p www
          # Копируем сайт в папку ассетов
          cp -r index.html www/ 2>/dev/null || true
          find . -maxdepth 1 -not -name '.*' -not -name 'www' -not -name 'node_modules' -exec cp -r {} www/ \; || true
          
          # Инициализируем проект Capacitor
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          npx cap init "VibeApp" "com.vibe.app" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: 6. Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

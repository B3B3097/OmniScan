name: Build APK from Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4.1. Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 5. Generate Android App Structure
        run: |
          # Создаем временную директорию сборки для чистой структуры
          mkdir -p build_temp
          
          # Копируем веб-ресурсы, исключая системные папки Git и Node
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='build_temp' ./ build_temp/ || true
          
          # Инициализируем проект Capacitor
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # Настраиваем проект
          npx cap init "VibeApp" "com.vibe.app" --web-dir "build_temp"
          npx cap add android
          npx cap sync android

      - name: 6. Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 7. Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

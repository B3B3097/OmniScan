юname: Ultimate Android Build (CI/CD)

on:
  # 1. РУЧНОЙ ЗАПУСК С ПАРАМЕТРАМИ
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Какую версию собрать?'
        required: true
        type: choice
        options:
          - 'Debug & Release'
          - 'Только Debug (быстрее)'
        default: 'Debug & Release'
      create_release:
        description: 'Опубликовать APK в GitHub Releases?'
        required: true
        type: boolean
        default: true

  # 2. Автоматический запуск (по желанию, можно удалить этот блок, если хочешь ТОЛЬКО вручную)
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK Command-Line Tools
        uses: android-actions/setup-android@v3

      - name: 5. Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: 6. Smart Web Build (NPM / Vite / React / Vue)
        run: |
          echo "=== Установка зависимостей и сборка веб-проекта ==="
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
          else
            echo "package.json не найден. Пропуск шага NPM сборки."
          fi

      - name: 7. Prepare Web Assets & Capacitor
        run: |
          mkdir -p www_dist
          
          if [ -d "dist" ]; then cp -r dist/* www_dist/
          elif [ -d "build" ]; then cp -r build/* www_dist/
          elif [ -d "www" ]; then cp -r www/* www_dist/
          else
            rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www_dist' ./ www_dist/
          fi

          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
            cat << 'EOF' > capacitor.config.json
            {
              "appId": "com.vibe.app",
              "appName": "VibeApp",
              "webDir": "www_dist",
              "bundledWebRuntime": false,
              "server": { "cleartext": true, "androidScheme": "https" }
            }
EOF
          fi

          npx cap add android || echo "Платформа android уже существует"
          npx cap sync android

      - name: 8. Generate App Icons & Splash Screens (if assets exist)
        run: |
          if [ -d "assets" ] && [ -f "assets/icon.png" ]; then
            npm install -g @capacitor/assets
            npx capacitor-assets generate --android
          fi

      - name: 9. Set Dynamic Version Code & Permissions
        run: |
          BUILD_NUM=${{ github.run_number }}
          GRADLE_FILE="android/app/build.gradle"
          
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/g" "$GRADLE_FILE"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
          fi

      - name: 10. Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 11. Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 12. Build Release APK & Sign
        # Этот шаг пропустится, если при ручном запуске выбрано "Только Debug"
        if: ${{ github.event.inputs.build_type == 'Debug & Release' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd android
          keytool -genkeypair -v -keystore release.keystore -alias vibe_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass vibe_password123 -keypass vibe_password123 -dname "CN=VibeApp, OU=App, O=Vibe, C=US"
          
          ./gradlew assembleRelease --stacktrace --no-daemon
          
          cd app/build/outputs/apk/release/
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 app-release-unsigned.apk VibeApp-Release.apk || cp app-release-unsigned.apk VibeApp-Release.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks ../../../../../release.keystore --ks-key-alias vibe_alias --ks-pass pass:vibe_password123 --key-pass pass:vibe_password123 VibeApp-Release.apk

      - name: 13. Upload Artifacts (Action Page)
        uses: actions/upload-artifact@v4
        with:
          name: VibeApp-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/VibeApp-Release.apk
          retention-days: 14

      - name: 14. Auto-Create GitHub Release
        uses: softprops/action-gh-release@v2
        # Создаст релиз, если стоит галочка при ручном запуске
        if: ${{ github.event.inputs.create_release == 'true' }}
        with:
          name: Release Build ${{ github.run_number }}
          tag_name: format('v1.0.{0}', github.run_number)
          files: |
            android/app/build/outputs/apk/release/VibeApp-Release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

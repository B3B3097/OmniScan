name: 🧹 Smart Repo Organizer

on:
  workflow_dispatch: # Запуск по кнопке вручную из вкладки Actions

permissions:
  contents: write    # Обязательное право для пуша изменений обратно в репо

jobs:
  organize-files:
    name: Sort Files into Directories
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Забираем всю историю, чтобы git mv отработал корректно

      - name: Create Architecture Directories
        run: |
          mkdir -p frontend
          mkdir -p backend/engine
          mkdir -p config

      - name: Move Files with Git (Preserving History)
        run: |
          # Фронтенд
          if [ -f "App.tsx" ]; then git mv App.tsx frontend/; fi
          if [ -f "index.html" ]; then git mv index.html frontend/; fi

          # Конфигурации и базы API
          if [ -f "api.txt" ]; then git mv api.txt config/; fi

          # Бэкенд (Корень)
          if [ -f "main.py" ]; then git mv main.py backend/; fi
          if [ -f "dekstop.py" ]; then git mv dekstop.py backend/; fi

          # Бэкенд (Движки и модули)
          if [ -f "engine_compromat.py" ]; then git mv engine_compromat.py backend/engine/; fi
          if [ -f "engine_search_engine.py" ]; then git mv engine_search_engine.py backend/engine/; fi
          if [ -f "olama_engine.py" ]; then git mv olama_engine.py backend/engine/; fi
          if [ -f "public.py" ]; then git mv public.py backend/engine/; fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Проверяем, есть ли изменения (чтобы Action не падал, если файлы уже перемещены)
          if git diff --staged --quiet; then
            echo "Нет файлов для перемещения. Репозиторий уже отсортирован."
          else
            git commit -m "chore: автоматическая сортировка файлов по архитектуре 🧹"
            git push origin HEAD:${GITHUB_REF}
            echo "Файлы успешно рассортированы и запушены!"
          fi

# FILE: .github/workflows/bundle_for_llm.yml
name: Auto-Commit Codebase Bundle

on:
  workflow_dispatch:

# Выдаем права боту на запись в репозиторий
permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Codebase Bundle
        run: |
          BUNDLE_FILE="repo_bundle.txt"
          echo "=== PROJECT CODEBASE BUNDLE ===" > $BUNDLE_FILE
          echo "Generated on: $(date)" >> $BUNDLE_FILE
          echo "===============================" >> $BUNDLE_FILE
          echo "" >> $BUNDLE_FILE

          # Ищем файлы, исключая мусор, скрытые директории и сам бандл
          find . -type f \
            -not -path "*/\.*" \
            -not -path "*/node_modules/*" \
            -not -path "*/venv/*" \
            -not -path "*/__pycache__/*" \
            -not -path "*/build/*" \
            -not -name "*.png" \
            -not -name "*.jpg" \
            -not -name "*.jpeg" \
            -not -name "*.gif" \
            -not -name "*.zip" \
            -not -name "repo_bundle.txt" | sort | while read -r file; do
              
              # Убираем лишние символы './' из пути для красоты
              clean_path=$(echo "$file" | sed 's|^\./||')
              
              # Пишем путь к файлу
              echo "// FILE: $clean_path" >> $BUNDLE_FILE
              
              # Пишем содержимое файла (код)
              cat "$file" >> $BUNDLE_FILE
              
              # Отступы для читаемости
              echo "" >> $BUNDLE_FILE
              echo "" >> $BUNDLE_FILE
          done

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo_bundle.txt
          
          # Проверяем, есть ли изменения. Если код не менялся, коммит не создастся (чтобы не было ошибки)
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate codebase txt bundle"
            git push
          fi

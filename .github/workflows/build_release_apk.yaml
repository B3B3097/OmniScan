name: Full Android APK Build & Diagnose

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Package
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Inspect Repository Structure
        run: |
          echo "=== ROOT DIRECTORY CONTENT ==="
          ls -la
          echo "=== LOCATING GRADLE / ANDROID FILES ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: 5. Accept Licenses & Configure SDK Path
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -d "app" ]; then
            echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          fi

      - name: 6. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 7. Build APK with Auto-Detection
        id: build_step
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"
          
          if [ -f "./gradlew" ]; then
            echo "Using project Gradle Wrapper..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --info
          elif [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            echo "Using installed Gradle runner..."
            gradle assembleDebug --stacktrace --info
          else
            echo "::error::Не найдены файлы сборки Gradle (build.gradle / settings.gradle) в корне репозитория!"
            exit 1
          fi

      - name: 8. Collect & Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14
